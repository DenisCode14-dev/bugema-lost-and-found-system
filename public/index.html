<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bugema Lost &amp; Found</title>
<style>
:root{--p:#2A3BA0;--pd:#0D1632;--g:#F2C94C;--r:#D62839;--ok:#2E9E6B;--bg:#FFFFFF;--soft:#F6F5E8;--card:#fff;--tx:#0D1632;--mu:#5d6480;--bd:#e3e1d2;--side:#0D1632;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
h2,h3,p{margin:0}h3{margin-bottom:6px}p{margin:6px 0}.mu{color:var(--mu)}a{color:var(--p)}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--side);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:14px;line-height:1.2}.brand small{font-weight:400;color:#c9cff0}
.logo{width:40px;height:40px;border-radius:50%;background:var(--g);color:var(--pd);display:grid;place-items:center;font-weight:800;border:4px solid var(--p);flex:none}
.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#c9cff0;text-decoration:none}
.side a:hover{background:rgba(255,255,255,.08);color:#fff}.side a.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--g)}.side a.on svg{color:var(--g)}.side .out{margin-top:auto}
.main{flex:1;min-width:0;padding:22px;max-width:1500px;margin:0 auto;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--g);color:var(--pd);box-shadow:0 0 0 3px var(--p);display:grid;place-items:center;font-weight:700;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(13,22,50,.07)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.stat{border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.stat .ci{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.65);display:grid;place-items:center;flex:none}.ia{display:flex;gap:8px;align-items:center}.stat b{font-size:30px;display:block;line-height:1.1}
.s1{background:#e4e8ff;color:#1d2a7a}.s2{background:#dcf3e8;color:#1b6b48}.s3{background:#fdf1cf;color:#7a5a00}.s4{background:#fbe0e3;color:#8f1a28}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.qa{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:14px}.qa a{text-decoration:none;color:var(--tx)}
.ph{height:110px;border-radius:10px;background:linear-gradient(135deg,#e4e8ff,#fdf1cf);display:grid;place-items:center;color:var(--p);margin-bottom:10px}
.item .btn{width:100%;margin-top:6px}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.b.r{background:#fbe0e3;color:#a11d2c}.b.ok{background:#dcf3e8;color:#1b6b48}.b.g{background:#fdf1cf;color:#7a5a00}.b.p{background:#e4e8ff;color:#1d2a7a}
.btn{display:inline-block;border:0;background:var(--p);color:#fff;padding:10px 16px;border-radius:10px;font:600 14px inherit;cursor:pointer;text-decoration:none;text-align:center}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.ok{background:var(--ok)}.btn.am{background:#c47a00}.btn.rd{background:var(--r)}.w{width:100%;margin-top:10px}
label{display:block;font-weight:600;font-size:13px;margin-top:12px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.two{display:grid;gap:0 12px;grid-template-columns:1fr}.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.err{color:var(--r);font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tab{padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);font-size:14px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.step{display:flex;gap:10px;margin:8px 0;align-items:center}.dot{width:24px;height:24px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:12px;flex:none}.dot.on{background:var(--ok);color:#fff}
.two-p{display:grid;gap:14px;grid-template-columns:1fr}.center{text-align:center}.big{font-size:44px}
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.hero{background:linear-gradient(160deg,var(--p),var(--pd));color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:center;gap:14px;border-right:6px solid var(--g)}.hero .logo{width:72px;height:72px;font-size:30px}
.form{max-width:420px;width:100%;margin:auto;padding:32px 22px}
@media(min-width:560px){.two{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}
@media(min-width:800px){.two-p{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:899px){.app{display:block}.side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;overflow-x:auto}.side .brand{display:none}.side a{flex-direction:column;gap:0;font-size:11px;padding:6px 8px;flex:1;min-width:58px;text-align:center}.side .out{margin-top:0}.main{padding:16px 14px 96px}}
@media(max-width:799px){.auth{grid-template-columns:1fr}.hero{padding:28px 22px;border-right:0;border-bottom:6px solid var(--g)}}
.btn:hover{filter:brightness(1.12)}input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:var(--p)}@media(max-width:899px){.side{border-top:1px solid rgba(255,255,255,.12)}.side a.on{box-shadow:inset 0 3px 0 var(--g)}}
th{background:var(--soft)}.back{display:inline-flex;gap:6px;align-items:center;background:transparent;border:1px solid var(--bd);color:var(--tx);padding:7px 12px;border-radius:10px;cursor:pointer;font:600 14px inherit;margin-bottom:14px}.back:hover{background:var(--soft)}@media(min-width:1100px){.main{padding:28px 40px}}@media(min-width:1400px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cats=["Bags","Wallets","Electronics","ID & Cards","Keys","Clothing","Other"],locs=["University Library","University Cafeteria","Lecture Room","Hostel","Sports Ground","Other"];
const d=x=>`<path d="${x}"/>`,C='<circle cx="12" cy="12" r="10"/>',P={back:d("M19 12H5M12 19l-7-7 7-7"),home:d("M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"),search:'<circle cx="11" cy="11" r="7"/>'+d("M21 21l-4.3-4.3"),plus:C+d("M12 8v8M8 12h8"),box:d("M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"),file:d("M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h6"),check:C+d("M8 12l3 3 5-6"),bell:d("M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"),layers:d("M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"),chart:d("M4 20V10M10 20V4M16 20v-8M22 20H2"),shield:d("M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4"),users:'<circle cx="9" cy="8" r="3.5"/>'+d("M2 20c0-3.5 3-6 7-6s7 2.5 7 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.5 4 2.5 4 6"),logout:d("M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9"),clock:C+d("M12 7v5l3 2"),bag:d("M6 8h12l1 13H5zM9 8V6a3 3 0 0 1 6 0v2"),wallet:d("M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1V10a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2zM17 14.5h.01"),phone:d("M9 2h6a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2"),card:d("M3 6h18v12H3zM14 10h4M14 13h4M6 16c0-1.5 1.5-2 3-2s3 .5 3 2")+'<circle cx="9" cy="10.5" r="1.8"/>',key:d("M15 3a6 6 0 0 0-5.7 8L3 17.3V21h4v-2h2v-2h2l1.3-1.3A6 6 0 1 0 15 3z")+'<circle cx="16" cy="8" r="1"/>',shirt:d("M8 3L3 6l2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0z")},CI={Bags:"bag",Wallets:"wallet",Electronics:"phone","ID & Cards":"card",Keys:"key",Clothing:"shirt",Other:"box"},ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none">${P[n]}</svg>`;
let items=[],claims=[],users=[],N={s:[],a:[]},me={},token=null;try{token=localStorage.getItem("blf")}catch{}
const fmt=d=>new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});
async function api(path,method="GET",body){
 const r=await fetch("/api"+path,{method,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j}
function toast(m){const t=document.createElement("div");t.textContent=m;t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#0D1632;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90%;box-shadow:0 4px 14px rgba(0,0,0,.25)";document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
const mapItem=(t,mine)=>i=>({id:i._id,ref:i.ref,name:i.name,cat:i.category,type:t,loc:i.location,date:fmt(i.date),desc:i.description,status:i.status,mine:mine.has(i._id),ts:i.createdAt||""});
async function loadAll(){
 const [lo,fo,my,nt]=await Promise.all([api("/items/lost"),api("/items/found"),api("/my/reports"),api("/notifications")]);
 const mine=new Set([...my.lost,...my.found].map(i=>i._id));
 items=[...lo.map(mapItem("Lost",mine)),...fo.map(mapItem("Found",mine))].sort((a,b)=>b.ts.localeCompare(a.ts));
 N.s=N.a=nt.map(n=>n.text);
 if(role=="a"){const c=await api("/claims");users=await api("/users");
  claims=c.map(x=>({id:x._id,ref:x.ref,item:x.foundItem&&x.foundItem._id,by:x.claimant?x.claimant.name:"Unknown",reg:"Reg. no. "+(x.claimant?x.claimant.regNo:""),why:x.reason,ev:[x.identifyingMarks,x.proofType&&"Proof: "+x.proofType,x.evidence].filter(Boolean).join(". "),status:x.status,note:x.adminNote,date:fmt(x.createdAt)}))}
 else{const c=await api("/claims/mine");
  claims=c.map(x=>({id:x._id,ref:x.ref,item:x.foundItem&&x.foundItem._id,by:me.name,reg:"",why:x.reason,ev:x.identifyingMarks,status:x.status,note:x.adminNote,date:fmt(x.createdAt),mine:1}))}
 claims=claims.filter(c=>items.some(i=>i.id==c.item));if(rv>=claims.length)rv=0}
let trail=[],role=null,sel=null,tab="Lost",q="",f="All",cat="All",rv=0;
const SN=[["dashboard","home","Home"],["browse","search","Browse"],["report-lost","plus","Lost"],["report-found","box","Found"],["my-reports","file","Reports"],["my-claims","check","Claims"],["notifications","bell","Alerts"]];
const AN=[["admin","chart","Overview"],["manage","layers","Items"],["review","shield","Claims"],["users","users","Users"],["notifications","bell","Alerts"]];
const badge=s=>`<span class="b ${{Missing:"r",Lost:"r",Rejected:"r",Found:"ok",Approved:"ok",Returned:"ok",Pending:"g",Reserved:"p",Closed:"p",Resolved:"ok"}[s]||"p"}">${s}</span>`;
const av=()=>`<div class="av">${esc((me.name||"?")[0].toUpperCase())}</div>`;
const st=(n,l,c,i)=>`<div class="stat ${c}"><div><b>${String(n).padStart(2,"0")}</b>${l}</div><span class="ci">${ic(i||{s1:"file",s2:"box",s3:"clock",s4:"check"}[c],20)}</span></div>`;
const card=i=>`<div class="card item"><div class="ph">${ic(CI[i.cat],46)}</div><h3>${esc(i.name)}</h3>${badge(i.type)}<p class="mu">${esc(i.loc)}<br>${i.date}</p><a class="btn sec" href="#item" onclick="sel='${i.id}'">View Details</a></div>`;
const tabs=(a,v,fn)=>`<div class="tabs">${a.map(x=>`<button class="tab ${x==v?"on":""}" onclick="${fn}('${x}')">${x}</button>`).join("")}</div>`;
const steps=s=>["Claim submitted|Your request has been received.","Administrator review|Your evidence will be checked.","Decision|"+(s=="Pending"?"You will be notified of the outcome.":"Your claim was "+s.toLowerCase()+".")].map((t,i)=>{const[a,b]=t.split("|");return`<div class="step"><div class="dot ${i<(s=="Pending"?1:3)?"on":""}">${i+1}</div><div><b>${a}</b><br><span class="mu">${b}</span></div></div>`}).join("");
const V={};
function auth(t,sub,body){return`<div class="auth"><div class="hero"><div class="logo">B</div><h2>Bugema University</h2><p>Excellence in Service</p><h2>Welcome to Lost &amp; Found</h2><p>${sub}</p></div><div class="form"><h2>${t}</h2><p class="mu">Enter your account details</p>${body}</div></div>`}
V.login=()=>auth("Login","Login to report, search and claim items.",`<form onsubmit="login(event)"><label>Registration number<input name="r" placeholder="e.g. 23-0001" required></label><label>Password<input name="p" type="password" required></label><p id="ae" class="err" hidden></p><button class="btn w">Login</button></form><p class="mu">Don’t have an account? <a href="#register">Sign up</a></p>`);
V.register=()=>auth("Student Sign up","Create your student account in a minute.",`<button type="button" class="back" onclick="back()">${ic("back",18)} Back to login</button><form onsubmit="register(event)"><label>Full name<input name="n" required></label><label>Registration number<input name="r" required></label><label>Email<input name="e" type="email" required></label><label>Phone<input name="t" type="tel"></label><label>Password (6+ characters)<input name="p" type="password" minlength="6" required></label><p id="ae" class="err" hidden></p><button class="btn w">Sign up</button></form><p class="mu">Already registered? <a href="#login">Login</a></p>`);
V.dashboard=()=>{const m=items.filter(i=>i.mine),c=claims.filter(x=>x.mine);return`<div class="top"><div><h2>Hello, ${esc(me.name.split(" ")[0])}!</h2><p class="mu">Welcome to Bugema Lost &amp; Found</p></div>${av()}</div>
<div class="stats">${st(m.filter(i=>i.type=="Lost").length,"My lost reports","s1")}${st(m.filter(i=>i.type=="Found").length,"My found reports","s2")}${st(c.filter(x=>x.status=="Pending").length,"Pending claims","s3")}${st(c.filter(x=>x.status!="Pending").length,"Resolved cases","s4")}</div>
<div class="two-p"><div><h3>Quick actions</h3><div class="qa"><a class="card" href="#report-lost"><b class="ia">${ic("plus",20)} Report lost item</b><p class="mu">Report a missing belonging</p></a><a class="card" href="#report-found"><b class="ia">${ic("box",20)} Report found item</b><p class="mu">Help another student</p></a></div></div>
<div class="card"><h3>Recent activity</h3>${c.map(x=>`<div class="li"><span>${items.find(i=>i.id==x.item).name} claim</span>${badge(x.status)}</div>`).join("")}${m.filter(i=>i.type=="Lost").map(i=>`<div class="li"><span>${esc(i.name)} report</span>${badge(i.status)}</div>`).join("")}</div></div>`};
function grid(){$("#g").innerHTML=items.filter(i=>(f=="All"||i.type==f)&&(cat=="All"||i.cat==cat)&&i.name.toLowerCase().includes(q.toLowerCase())).map(card).join("")||"<p class='mu'>No items match your search.</p>"}
V.browse=()=>{setTimeout(grid);return`<div class="top"><h2>Browse Items</h2>${av()}</div><div class="card"><input placeholder="Search items…" value="${esc(q)}" oninput="q=this.value;grid()"><div class="two"><label>Type<select onchange="f=this.value;grid()">${["All","Lost","Found"].map(x=>`<option ${x==f?"selected":""}>${x}</option>`).join("")}</select></label><label>Category<select onchange="cat=this.value;grid()">${["All",...cats].map(x=>`<option ${x==cat?"selected":""}>${x}</option>`).join("")}</select></label></div></div><div class="grid" id="g"></div>`};
const rep=t=>`<div class="top"><h2>Report ${t} Item</h2>${av()}</div><form class="card" onsubmit="sub(event,'${t}')"><h3>Item information</h3><label>Item name<input name="n" required placeholder="e.g. Black laptop bag"></label><div class="two"><label>Category<select name="c">${cats.map(c=>`<option>${c}</option>`).join("")}</select></label><label>Date ${t.toLowerCase()}<input type="date" name="d" required></label></div><label>Description<textarea name="x" rows="3" required placeholder="Colour, brand, unique marks…"></textarea></label><h3 style="margin-top:16px">${t=="Lost"?"Last known location":"Where it was found"}</h3><label>Location<select name="l">${locs.map(c=>`<option>${c}</option>`).join("")}</select></label><label>Photo (optional)<input type="file" accept="image/*"></label>${t=="Found"?'<p class="mu">Your contact details stay private. Only the administrator can see them.</p>':""}<div class="row"><a class="btn sec" href="#dashboard">Cancel</a><button class="btn">Submit ${t} Report →</button></div></form>`;
V["report-lost"]=()=>rep("Lost");V["report-found"]=()=>rep("Found");
async function sub(e,t){e.preventDefault();const d=new FormData(e.target);try{const it=await api("/items/"+t.toLowerCase(),"POST",{name:d.get("n"),category:d.get("c"),description:d.get("x"),location:d.get("l"),date:d.get("d")});sel=it._id;await loadAll();location.hash="#done"}catch(x){toast(x.message)}}
V.done=()=>{const i=items.find(x=>x.id==sel);return`<div class="card center"><div class="big" style="color:var(--ok)">${ic("check",64)}</div><h2>Report submitted!</h2><p class="mu">Your ${i.type.toLowerCase()} item has been successfully reported.</p><div class="li"><span>Reference number</span><b>${i.ref}</b></div><div class="li"><span>Item</span><b>${esc(i.name)}</b></div><div class="li"><span>Status</span>${badge(i.status)}</div><a class="btn w" href="#my-reports">View My Reports</a></div>`};
V.item=()=>{const i=items.find(x=>x.id==sel)||items[0];return`<div class="top"><h2>${esc(i.name)}</h2>${av()}</div><div class="two-p"><div class="card"><div class="ph" style="height:200px">${ic(CI[i.cat],90)}</div></div><div class="card"><p>${badge(i.status)} <span class="mu">${i.ref}</span></p><div class="li"><span>Category</span><b>${i.cat}</b></div><div class="li"><span>Location</span><b>${esc(i.loc)}</b></div><div class="li"><span>Date</span><b>${i.date}</b></div><p>${esc(i.desc)}</p>${i.type=="Found"&&!i.mine&&role!="a"?`<div class="card" style="background:var(--soft)"><h3>Is this your item?</h3><p class="mu">If you believe this item belongs to you, submit a claim for administrator verification.</p><a class="btn w" href="#claim">Submit a Claim</a></div><p class="mu">The finder’s contact information is never shown publicly.</p>`:""}</div></div>`};
V.claim=()=>{const i=items.find(x=>x.id==sel);return`<div class="top"><h2>Submit a Claim</h2>${av()}</div><form class="card" onsubmit="clm(event)"><p>Claiming: <b>${esc(i.name)}</b> ${badge(i.status)}</p><label>Why do you believe this item belongs to you?<textarea name="w" rows="3" required></textarea></label><label>Identifying characteristics<input name="k" required placeholder="e.g. small red keyholder"></label><label>Proof of ownership<select name="p"><option>Receipt</option><option>Photo of me with the item</option><option>Serial number</option><option>Other</option></select></label><label>Additional information / evidence (optional)<textarea name="e" rows="2"></textarea></label><div class="row"><a class="btn sec" href="#item">Cancel</a><button class="btn">Submit Claim</button></div></form>`};
async function clm(e){e.preventDefault();const d=new FormData(e.target);try{await api("/claims","POST",{foundItem:sel,reason:d.get("w"),identifyingMarks:d.get("k"),proofType:d.get("p"),evidence:d.get("e")});await loadAll();location.hash="#my-claims"}catch(x){toast(x.message)}}
V["my-reports"]=()=>{const l=items.filter(i=>i.mine&&i.type==tab);return`<div class="top"><h2>My Reports</h2>${av()}</div>${tabs(["Lost","Found"],tab,"setTab")}<div class="card tw"><table><tr><th>Reference</th><th>Item</th><th>Date</th><th>Status</th><th></th></tr>${l.map(i=>`<tr><td>${i.ref}</td><td>${esc(i.name)}</td><td>${i.date}</td><td>${badge(i.status)}</td><td><a href="#item" onclick="sel='${i.id}'">View</a></td></tr>`).join("")||"<tr><td colspan=5 class='mu'>No reports yet.</td></tr>"}</table></div>`};
function setTab(t){tab=t;render()}
V["my-claims"]=()=>`<div class="top"><h2>My Claims</h2>${av()}</div>${claims.filter(c=>c.mine).map(c=>`<div class="card"><div class="li"><b>Claim ${c.ref} · ${esc(items.find(i=>i.id==c.item).name)}</b>${badge(c.status)}</div><p class="mu">Submitted ${c.date}</p>${steps(c.status)}${c.note?`<p><b>Administrator feedback:</b> ${esc(c.note)}</p>`:""}</div>`).join("")}`;
V.notifications=()=>`<div class="top"><h2>Notifications</h2>${av()}</div><div class="card">${N[role=="a"?"a":"s"].map(n=>`<div class="li"><span class="ia">${ic("bell",18)} ${esc(n)}</span></div>`).join("")}</div>`;
V.admin=()=>{const p=claims.filter(c=>c.status=="Pending");return`<div class="top"><div><h2>Administrator Overview</h2><p class="mu">Bugema Lost &amp; Found</p></div>${av()}</div><div class="stats">${st(items.length,"Total reports","s1")}${st(p.length,"Pending claims","s3")}${st(items.filter(i=>i.status=="Returned"||i.status=="Reserved").length,"Resolved items","s2","check")}${st(items.filter(i=>!["Returned","Reserved","Closed"].includes(i.status)).length,"Active reports","s4","layers")}</div>
<div class="two-p"><div class="card"><h3>Pending claims</h3>${p.map(c=>`<div class="li"><span><b>${c.ref}</b><br><span class="mu">${esc(items.find(i=>i.id==c.item).name)}</span></span><a class="btn sec" href="#review" onclick="rv=${claims.indexOf(c)}">Review</a></div>`).join("")||"<p class='mu'>Nothing pending.</p>"}</div><div class="card"><h3>Recent reports</h3>${items.slice(0,4).map(i=>`<div class="li"><span class="ia">${ic(CI[i.cat],18)} ${esc(i.name)}</span>${badge(i.status)}</div>`).join("")}</div></div>`};
V.manage=()=>{const l=items.filter(i=>i.type==tab),o=tab=="Lost"?["Missing","Resolved","Closed"]:["Found","Reserved","Returned","Closed"];return`<div class="top"><h2>Manage ${tab} Items</h2>${av()}</div>${tabs(["Lost","Found"],tab,"setTab")}<div class="card tw"><table><tr><th>Ref</th><th>Item</th><th>Category</th><th>Location</th><th>Date</th><th>Status</th><th></th></tr>${l.map(i=>`<tr><td>${i.ref}</td><td>${esc(i.name)}</td><td>${i.cat}</td><td>${esc(i.loc)}</td><td>${i.date}</td><td><select onchange="setStatus('${i.id}',this.value)">${o.map(s=>`<option ${s==i.status?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="btn sec" onclick="if(this.dataset.s){del('${i.id}')}else{this.dataset.s=1;this.textContent='Sure?'}">Delete</button></td></tr>`).join("")}</table></div>`};
async function del(id){const i=items.find(x=>x.id==id);try{await api("/items/"+i.type.toLowerCase()+"/"+id,"DELETE");await loadAll();render()}catch(x){toast(x.message)}}
async function setStatus(id,v){const i=items.find(x=>x.id==id);try{await api("/items/"+i.type.toLowerCase()+"/"+id,"PUT",{status:v});i.status=v;toast("Status updated")}catch(x){toast(x.message);render()}}
async function toggleUser(id,a){try{await api("/users/"+id+"/active","PATCH",{active:a});await loadAll();render()}catch(x){toast(x.message)}}
V.review=()=>{if(!claims.length)return`<div class="top"><h2>Review Claims</h2>${av()}</div><div class="card">No claims yet.</div>`;const c=claims[rv],it=items.find(i=>i.id==c.item);return`<div class="top"><h2>Review Claims</h2>${av()}</div>${`<div class="tabs">${claims.map((x,i)=>`<button class="tab ${i==rv?"on":""}" onclick="rv=${i};render()">${x.ref}</button>`).join("")}</div>`}<div class="two-p"><div class="card"><h3>Item information</h3><div class="ph">${ic(CI[it.cat],46)}</div><p><b>${esc(it.name)}</b> ${badge(it.status)}</p><p class="mu">${esc(it.desc)}<br>Date: ${it.date}<br>Location: ${esc(it.loc)}<br>Private identifying details are hidden from the public.</p></div><div class="card"><h3>Claimant information</h3><p><b>${esc(c.by)}</b><br><span class="mu">${c.reg}</span></p><p>${badge(c.status)}</p><p><b>Explanation</b><br>${esc(c.why)}</p><p><b>Evidence</b><br>${esc(c.ev)}</p>${c.status=="Pending"?`<label>Reason (required to approve or reject)<textarea id="rs" rows="2"></textarea></label><p id="er" class="err" hidden>Please give a reason first.</p><div class="row3"><button class="btn ok" onclick="act('Approved')">Approve</button><button class="btn am" onclick="act('Info')">Request info</button><button class="btn rd" onclick="act('Rejected')">Reject</button></div>`:`<p class="mu">Decision note: ${esc(c.note||"None")}</p>${c.status=="Approved"&&it.status!="Returned"?`<button class="btn w" onclick="ret()">Mark item as returned</button>`:""}`}</div></div>`};
async function act(s){const c=claims[rv],r=$("#rs").value.trim();if(s!="Info"&&!r){$("#er").hidden=false;return}try{await api("/claims/"+c.id+"/review","PATCH",{decision:s,reason:r});await loadAll();render();toast("Decision saved")}catch(x){toast(x.message)}}
async function ret(){try{await api("/items/found/"+claims[rv].item+"/return","PATCH");await loadAll();render()}catch(x){toast(x.message)}}
V.users=()=>`<div class="top"><h2>Students &amp; Administrators</h2>${av()}</div><div class="card tw"><table><tr><th>Name</th><th>Reg. no.</th><th>Role</th><th>Status</th><th>Registered</th><th></th></tr>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.regNo)}</td><td>${u.role=="admin"?"Administrator":"Student"}</td><td><span class="b ${u.active?"ok":"r"}">${u.active?"Active":"Suspended"}</span></td><td>${fmt(u.createdAt)}</td><td>${u._id==me.id||u.role=="admin"?"":`<button class="btn sec" onclick="toggleUser('${u._id}',${!u.active})">${u.active?"Suspend":"Activate"}</button>`}</td></tr>`).join("")}</table></div>`;
function back(){if(location.hash=="#register"){location.hash="#login";return}trail.pop();const p=trail.pop();location.hash="#"+(p&&!["login","register","done"].includes(p)?p:role=="a"?"admin":"dashboard")}
async function enter(r){token=r.token;try{localStorage.setItem("blf",token)}catch{}me=r.user;role=me.role=="admin"?"a":"s";trail=[];await loadAll();location.hash=role=="a"?"#admin":"#dashboard";render()}
const fail=x=>{const m=$("#ae");m.textContent=x.message;m.hidden=false};
async function login(e){e.preventDefault();const f=new FormData(e.target);try{await enter(await api("/auth/login","POST",{regNo:f.get("r"),password:f.get("p")}))}catch(x){fail(x)}}
async function register(e){e.preventDefault();const f=new FormData(e.target);try{await enter(await api("/auth/register","POST",{name:f.get("n"),regNo:f.get("r"),email:f.get("e"),phone:f.get("t"),password:f.get("p")}))}catch(x){fail(x)}}
function logout(){role=null;token=null;me={};trail=[];try{localStorage.removeItem("blf")}catch{}}
async function refresh(){if(role){try{await loadAll()}catch(e){if(/log in/i.test(e.message)){logout();location.hash="#login"}}}render()}
function render(){const h=location.hash.slice(1)||"login",au=h=="login"||h=="register";if(trail[trail.length-1]!==h)trail.push(h);if(!au&&!role){location.hash="#login";return}
let v;try{v=(V[h]||V.login)()}catch(e){console.error(e);v=`<div class="card">This page could not be loaded. <a href="#${role=="a"?"admin":"dashboard"}">Go home</a></div>`}if(au){$("#app").innerHTML=v;return}
const nav=role=="a"?AN:SN;$("#app").innerHTML=`<div class="app"><nav class="side"><div class="brand"><div class="logo">B</div><div>Bugema<br><small>Lost &amp; Found</small></div></div>${nav.map(n=>`<a href="#${n[0]}" class="${h==n[0]?"on":""}">${ic(n[1],20)}${n[2]}</a>`).join("")}<a href="#login" class="out" onclick="logout()">${ic("logout",20)}Logout</a></nav><main class="main">${["dashboard","admin"].includes(h)?"":`<button class="back" onclick="back()">${ic("back",18)} Back</button>`}${v}</main></div>`;window.scrollTo(0,0)}
window.addEventListener("hashchange",refresh);
(async()=>{if(token){try{me=await api("/auth/me");role=me.role=="admin"?"a":"s";await loadAll()}catch{logout()}}render()})();
</script></body></html>
